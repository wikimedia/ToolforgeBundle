name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build:

    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        deps: [ 'highest' ]
        include:
          # Also build the lowest permitted dependencies. Composer installs the
          # highest match by default, so without this the floor of the version
          # constraints in composer.json is never tested.
          - php: '8.1'
            deps: 'lowest'

    name: PHP ${{matrix.php}} / ${{matrix.deps}} dependencies

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{matrix.php}}

      - name: Install dependencies
        if: matrix.deps == 'highest'
        run: composer install --no-interaction --no-progress

      # The lowest symfony/phpunit-bridge has a simple-phpunit script that
      # cannot install its own copy of PHPUnit. This job tests the floor of the
      # runtime packages, so give the test tools their usual version.
      - name: Install lowest dependencies
        if: matrix.deps == 'lowest'
        run: |
          composer update --no-interaction --no-progress --prefer-lowest --prefer-stable
          composer update --no-interaction --no-progress symfony/phpunit-bridge

      - name: Test
        run: composer test
